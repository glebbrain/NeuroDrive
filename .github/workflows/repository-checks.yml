name: Repository checks

on:
  push:
  pull_request:

jobs:
  repository:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Validate repository contracts
        shell: python
        run: |
          from pathlib import Path
          import re
          required = ['LICENSE', 'README.md', 'AGENTS.md', 'CONTRIBUTING.md', 'docs/ROADMAP.md', 'docs/PHILOSOPHY.md', '.manager/codex-exec.md']
          missing = [p for p in required if not Path(p).is_file()]
          assert not missing, f'Missing required files: {missing}'
          license_head = Path('LICENSE').read_text(encoding='utf-8')[:300]
          assert 'GNU GENERAL PUBLIC LICENSE' in license_head and 'Version 3' in license_head
          media_ext = {'.mp3','.flac','.wav','.ogg','.m4a','.aac','.wma','.opus'}
          media = [str(p) for p in Path('.').rglob('*') if p.is_file() and '.git' not in p.parts and p.suffix.lower() in media_ext]
          assert not media, f'Audio files must not be committed: {media}'
          for f in Path('TODO').glob('*.md'):
              lines = f.read_text(encoding='utf-8').splitlines()
              starts = [i for i,line in enumerate(lines) if line.startswith('[ ]') or line.startswith('[x]')]
              ends = [i for i,line in enumerate(lines) if line == '---']
              assert len(starts) == len(ends), f'{f}: task boundaries mismatch'
              for a,b in zip(starts,ends):
                  assert a < b, f'{f}: invalid task boundary'
                  assert any('SP:' in line and 1 <= int(re.search(r'SP:\s*(\d+)',line).group(1)) <= 3 for line in lines[a:b] if re.search(r'SP:\s*\d+',line)), f'{f}: missing/invalid SP'
              assert all(any(a < i < b for a,b in zip(starts,ends)) for i in ends), f'{f}: stray --- separator'
          print('Repository contracts PASS')
